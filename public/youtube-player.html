<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- YouTube refuses embeds without a Referer (error 153): send only this origin, never a path or query. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Player de aulas</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; color: #fff; font: 14px system-ui, sans-serif; text-align: center; pointer-events: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="status" role="status">Conectando ao YouTube…</div>
  <script src="/isolated-origin-policy.js" defer></script>
  <script src="/youtube-player.js" defer></script>
</body>
</html>
